name: Release (signed AAB)

on:
  push:
    tags: ['v*']

jobs:
  release:
    name: 🚀 Build & sign AAB for Cafe Bazaar / Myket
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install (reproducible)
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test

      - name: Build production web bundle
        run: npm run build:app

      - name: Check web size budget
        run: node tools/check-budget.mjs web packages/app-shell/dist

      - name: Add Android platform & sync Capacitor
        working-directory: native
        run: |
          npm ci
          npx cap add android || true
          npx cap sync android
          node tools/apply-overrides.mjs

      - name: Decode keystore from secrets
        working-directory: native
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::سکرت KEYSTORE_B64 تنظیم نشده — راهنما: native/README.md"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/dordaneh-release.keystore

      - name: Build signed release AAB
        working-directory: native/android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/dordaneh-release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Check AAB size budget (< 30MB)
        run: |
          AAB=$(find native/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "AAB: $AAB"
          node tools/check-budget.mjs aab "$AAB"

      - name: Rename artifact
        run: |
          AAB=$(find native/android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$AAB" "dordaneh-${GITHUB_REF_NAME}.aab"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: dordaneh-aab-${{ github.ref_name }}
          path: dordaneh-*.aab
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dordaneh-*.aab
          generate_release_notes: true
